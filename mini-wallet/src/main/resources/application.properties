spring.application.name=mini-wallet

# ---- MySQL ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mini_wallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- Schema is owned by schema.sql; Hibernate only validates it ----
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Fail fast instead of waiting forever on a row lock
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

# Do not leak framework details in error responses
server.error.include-stacktrace=never
server.error.include-message=never
spring.mvc.problemdetails.enabled=false
